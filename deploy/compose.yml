# The products interface as a remote of the container. No published port: opti-front proxies /remotes/products/.
name: opti-products-portal

services:
  products-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: opti/products-portal:local
    networks:
      - platform
    expose:
      - "80"
    restart: unless-stopped

networks:
  platform:
    external: true
